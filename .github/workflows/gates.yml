name: gates

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: lint
        run: pip install ruff && ruff check .
      - name: unit gates
        run: python -m unittest discover -s tests
      - name: determinism gate (cross-process)
        run: python verify/determinism.py
      - name: success signature (five yeses)
        run: python verify/success_signature.py
