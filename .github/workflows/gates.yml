name: gates

on: [push, pull_request]

# Public repo, least privilege: the gates only read the tree.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: lint
        # Pinned: an unpinned linter is a nondeterministic gate. Bump
        # deliberately, alongside a local run of the same version.
        run: pip install ruff==0.15.10 && ruff check .
      - name: unit gates
        run: python -m unittest discover -s tests
      - name: determinism gate (cross-process)
        run: python verify/determinism.py
      - name: adapter equivalence (wire-format seam)
        run: python verify/adapter_equivalence.py
      - name: success signature (five yeses)
        run: python verify/success_signature.py
