[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salus"
version = "0.2.0"
description = "SALUS — vitals layer and deterministic wake predicate (Condition Wakes Memory)"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Joseph Ibrahim" }]
dependencies = []

[project.optional-dependencies]
usd = ["usd-core"]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.13"
